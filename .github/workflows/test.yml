name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: ./dashhound selftest
      - run: node test/redact.test.js
      - run: for f in extension/*.js; do node --check "$f"; done
      - run: python -c "import json; json.load(open('extension/manifest.json'))"
