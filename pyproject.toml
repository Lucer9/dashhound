[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dashhound"
version = "0.4.0"
description = "A dashcam for your dev browser: a local log of clicks, field changes and API calls for you and your coding agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

# The CLI is one extensionless file, so it installs as a script (pip puts it in the environment's bin and points
# its shebang at that Python) rather than as a module. The extension ships as data for `dashhound pack`.
[tool.setuptools]
packages = []
script-files = ["dashhound"]

[tool.setuptools.data-files]
"share/dashhound/extension" = ["extension/*"]
